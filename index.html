<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repository cancellato</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #111;
      }
      .box {
        text-align: center;
        padding: 40px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }
      p {
        margin: 0;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Sito cancellato</h1>
      <p>Questo repository è stato svuotato.</p>
    </div>
  </body>
</html>
